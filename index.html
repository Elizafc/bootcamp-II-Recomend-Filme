<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo Ghibli</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🎬 Estúdio Ghibli</h1>
    <p>Explore os filmes do lendário estúdio japonês</p>
  </header>

  <main>
    <section class="filtro">
      <input type="text" id="busca" placeholder="Filtrar por título..." />
    </section>

    <section id="filmes-container" class="grid"></section>
    <div id="status" class="status"></div>

    <!-- SEÇÃO DE FAVORITOS (Agora no lugar certo) -->
    <section id="favoritos-section" class="favoritos-section">
      <h2>❤️ Meus Favoritos</h2>
      <div id="favoritos-container"></div>
    </section>
  </main>

  <!-- Modal de detalhes -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="fechar">&times;</span>
      <h2 id="modal-titulo"></h2>
      <p><strong>Diretor:</strong> <span id="modal-diretor"></span></p>
      <p><strong>Roteirista:</strong> <span id="modal-roteirista"></span></p>
      <p><strong>Ano:</strong> <span id="modal-ano"></span></p>
      <p><strong>Sinopse:</strong> <span id="modal-sinopse"></span></p>
      <!-- BOTÃO FAVORITAR ADICIONADO -->
      <button id="btn-favoritar" class="btn-favoritar">❤️ Adicionar aos Favoritos</button>
    </div>
  </div>

  <footer>
    Feito com ❤️ para o Bootcamp II · Dados via Studio Ghibli API
  </footer>

  <script src="script.js"></script>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    // ATENÇÃO: Cole aqui a URL e a chave Anon do seu painel do Supabase
    const SUPABASE_URL = "https://uzqxjzkiazfxkvizjegg.supabase.co";
    const SUPABASE_ANON_KEY = "SUA_CHAVE_ANON_AQUI"; // <-- COLE A SUA CHAVE AQUI

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    window.supabaseHelpers = {
      async salvarFavorito(titulo, extra) {
        const { error } = await supabase.from("favoritos").insert({ titulo_filme: titulo, dados_extra: extra });
        if (error) { console.error("Erro ao salvar:", error); return false; }
        return true;
      },
      async listarFavoritos() {
        const { data, error } = await supabase.from("favoritos").select("*").order("criado_em", { ascending: true });
        if (error) { console.error("Erro ao listar:", error); return []; }
        return data;
      },
      async removerFavorito(id) {
        const { error } = await supabase.from("favoritos").delete().eq("id", id);
        if (error) console.error("Erro ao remover:", error);
      }
    };

    window.dispatchEvent(new Event("supabase-ready"));
  </script>
</body>
</html>
