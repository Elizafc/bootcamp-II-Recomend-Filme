<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo Ghibli</title>
  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🎬 Estúdio Ghibli</h1>
    <p>Explore os filmes do lendário estúdio japonês</p>
  </header>

  <main>
    <!-- Filtro -->
    <section class="filtro">
      <input type="text" id="busca" placeholder="Filtrar por título..." />
    </section>

    <!-- Grid de cards -->
    <section id="filmes-container" class="grid">
      <!-- Os cards serão inseridos pelo JavaScript -->
    </section>

    <!-- Mensagem de erro / loading -->
    <div id="status" class="status"></div>
  </main>

  <!-- Modal de detalhes -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="fechar">&times;</span>
      <h2 id="modal-titulo"></h2>
      <p><strong>Diretor:</strong> <span id="modal-diretor"></span></p>
      <p><strong>Roteirista:</strong> <span id="modal-roteirista"></span></p>
      <p><strong>Ano:</strong> <span id="modal-ano"></span></p>
      <p><strong>Sinopse:</strong> <span id="modal-sinopse"></span></p>
    </div>
  </div>

  <script src="script.js"></script>
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL = "https://SEU-PROJETO.supabase.co";
    const SUPABASE_ANON_KEY = "SUA_CHAVE_ANON";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Disponibiliza as funções para o escopo global (para o script.js usar)
    window.supabaseHelpers = {
      async salvarFavorito(titulo, extra) {
        const { error } = await supabase
          .from("favoritos")
          .insert({ titulo_filme: titulo, dados_extra: extra });
        if (error) {
          console.error("Erro ao salvar favorito:", error);
          return false;
        }
        return true;
      },

      async listarFavoritos() {
        const { data, error } = await supabase
          .from("favoritos")
          .select("*")
          .order("criado_em", { ascending: true });
        if (error) {
          console.error("Erro ao listar favoritos:", error);
          return [];
        }
        return data;
      },

      async removerFavorito(id) {
        const { error } = await supabase
          .from("favoritos")
          .delete()
          .eq("id", id);
        if (error) console.error("Erro ao remover favorito:", error);
      }
    };
    <section id="favoritos-section">
      <h2>❤️ Meus Favoritos</h2>
      <div id="favoritos-container"></div>
    </section>
    // Dispara um evento para avisar o script.js que o Supabase está pronto
    window.dispatchEvent(new Event("supabase-ready"));
  </script>
  <footer style="text-align:center; margin-top:3rem; color:#7a5d4a; font-size:0.9rem;">
    Feito com ❤️ para o Bootcamp II · Dados via Studio Ghibli API
  </footer>
</body>
</html>
